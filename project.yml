# Reelmail. `xcodegen generate` makes Reelmail.xcodeproj (not checked in).
name: Reelmail
options:
  bundleIdPrefix: com.grahamdeno
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7MHDTK68M2
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Reelmail:
    type: application
    platform: iOS
    sources:
      - App/Reelmail
    configFiles:
      Debug: Config/Reelmail.xcconfig
      Release: Config/Reelmail.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.reelmail
        CODE_SIGN_ENTITLEMENTS: Config/Reelmail.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Lovely
        INFOPLIST_KEY_NSContactsUsageDescription: "Lovely shows your contacts' photos next to their mail. Photos stay on this iPhone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  ReelmailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/ReelmailTests
    dependencies:
      - target: Reelmail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grahamdeno.reelmail.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Reelmail:
    build:
      targets:
        Reelmail: all
    test:
      targets:
        - ReelmailTests
